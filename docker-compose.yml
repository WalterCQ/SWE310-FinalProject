services:
  backend:
    build:
      context: ./backend/TaskFlow.Api
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TaskFlowConnectDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
      Jwt__Issuer: "TaskFlowConnect"
      Jwt__Audience: "TaskFlowConnectClient"
      Jwt__SigningKey: ""
      Auth__AllowDevelopmentUserFallback: "true"
      Auth__DevelopmentUserId: "11111111-1111-1111-1111-111111111111"
      Auth__DevelopmentUserEmail: "dev@taskflow.local"
      AI__Provider: "OpenAICompatible"
      AI__ApiKey: ""
      AI__Model: "gpt-4o-mini"
      AI__Endpoint: ""
      Pinecone__Enabled: "false"
      Pinecone__ApiKey: ""
      Pinecone__IndexName: ""
      Pinecone__NamespacePrefix: "taskflow"
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    profiles:
      - redis
    ports:
      - "6379:6379"

volumes:
  sqlserver-data:
