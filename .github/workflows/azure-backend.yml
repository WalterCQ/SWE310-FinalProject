name: Deploy TaskFlow API to Azure

on:
  push:
    branches:
      - main
    paths:
      - "backend/TaskFlow.Api/**"
      - ".github/workflows/azure-backend.yml"
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: taskflow-connect-06221341-feb9
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: backend/TaskFlow.Api/TaskFlow.Api.csproj

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "$PROJECT_PATH"

      - name: Publish
        run: dotnet publish "$PROJECT_PATH" --configuration Release --no-restore --output "${{ runner.temp }}/publish"

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-api
          path: ${{ runner.temp }}/publish

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://taskflow-connect-06221341-feb9.azurewebsites.net

    steps:
      - name: Download published app
        uses: actions/download-artifact@v4
        with:
          name: taskflow-api
          path: publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
