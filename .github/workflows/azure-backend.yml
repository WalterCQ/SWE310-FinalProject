name: Deploy TaskFlow backend container to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: taskflow-connect-06221341-feb9
  AZURE_RESOURCE_GROUP: rg-taskflow-connect
  ACR_NAME: taskflowconnect06221341
  DOTNET_VERSION: "10.0.x"
  IMAGE_NAME: taskflow-backend

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build API
        run: dotnet build backend/TaskFlow.Api/TaskFlow.Api.csproj --configuration Release

      - name: Build AgentWorker
        run: dotnet build backend/TaskFlow.AgentWorker/TaskFlow.AgentWorker.csproj --configuration Release

  deploy:
    name: Build and deploy container
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: production
      url: https://taskflow-connect-06221341-feb9.azurewebsites.net

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Azure Container Registry
        run: |
          az acr show --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1 \
            || az acr create --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --sku Basic --admin-enabled true
          az acr update --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --admin-enabled true

      - name: Build and push image
        run: |
          login_server="$(az acr show --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query loginServer -o tsv)"
          az acr login --name "$ACR_NAME"
          image="$login_server/$IMAGE_NAME:${{ github.sha }}"
          docker build -f deploy/backend.Dockerfile -t "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "LOGIN_SERVER=$login_server" >> "$GITHUB_ENV"

      - name: Deploy image to App Service
        run: |
          username="$(az acr credential show --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query username -o tsv)"
          password="$(az acr credential show --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query passwords[0].value -o tsv)"
          az webapp config container set \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --docker-custom-image-name "$IMAGE" \
            --docker-registry-server-url "https://$LOGIN_SERVER" \
            --docker-registry-server-user "$username" \
            --docker-registry-server-password "$password"
          az webapp config appsettings set \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings WEBSITES_PORT=8080 AgentSkills__RootPath=/app/tools/agent-skills AgentSkills__PythonExecutable=/opt/taskflow/ppt-master-venv/bin/python
          az webapp restart --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP"
